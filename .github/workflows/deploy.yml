name: Deploy to Github Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# A branch to publish as a preview of the homepage at /preview/ (not indexed).
# Leave empty when there is nothing to preview.
env:
  PREVIEW_REF: site/option-c

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            dist
            .nuxt
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('dist') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-
      - name: Install dependencies
        run: npm ci
      - name: Download latest.json manifest
        run: curl -fL -o public/latest.json https://github.com/unxsist/jet-pilot/releases/latest/download/latest.json
      - name: Prepend the update notice to the release notes
        run: node scripts/patch-update-manifest.mjs
      - name: Static HTML export with Nuxt
        run: npx nuxt build --preset github_pages
      - name: Checkout the homepage preview
        if: env.PREVIEW_REF != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}
          path: preview-src
      - name: Build the homepage preview into /preview/
        if: env.PREVIEW_REF != ''
        working-directory: preview-src
        env:
          SITE_PREVIEW: "1"
          NUXT_APP_BASE_URL: /preview/
        run: |
          npm ci
          npx nuxt build --preset github_pages
          rm -rf .output/public/sitemap.xml .output/public/__sitemap__
          mkdir -p ../dist/preview
          cp -r .output/public/. ../dist/preview/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
